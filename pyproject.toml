[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-live-maker"
version = "0.1.0"
description = "Autonomous live liquidity-rewards market maker for Polymarket. REST/API-based (py-clob-client), polling-driven, no MCP, no LLM in the loop. Real-money go-live behind an explicit operator switch."
authors = [{name = "agent-next"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["polymarket", "market-making", "liquidity-rewards", "prediction-markets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# the real-order path (signing + posting via the public CLOB REST API).
# Not needed for dry-run or the test suite (imported lazily, behind PM_TRADER_LIVE).
# NOTE: py-clob-client is ARCHIVED/unmaintained upstream (Polymarket now ships the
# unified `py-sdk`). The pinned 0.17.x still works against the live CLOB; revisit
# migrating the execution layer to py-sdk before relying on it long-term.
live = [
    "py-clob-client>=0.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
include = ["pm_trader*"]

[tool.pytest.ini_options]
markers = ["live: tests requiring network access to Polymarket API"]

[project.scripts]
pm-trader = "pm_trader.cli:main"
live-maker = "pm_trader.runner:main"
